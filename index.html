<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>スギスギてまこ（推し熱量リズムゲーム）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- START -->
  <section id="start" class="screen">
    <div class="eyebrow">推し熱量リズムゲーム</div>
    <h1>スギスギてまこ</h1>
    <p class="sub">好きな曲を読み込んで、降ってくるノーツをタイミングよくタップ！<br>推し熱量ゲージを溜めて限界突破しよう。</p>
    <div class="card">
      <label class="upload-zone" id="uploadZone" for="audioInput">
        <svg class="upload-icon" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
        <div class="label" id="uploadLabel">音楽ファイルをタップして選ぶ</div>
        <div class="filetypes">mp3 / m4a / wav / aac / ogg</div>
        <div class="fname" id="fileName"></div>
      </label>
      <input type="file" id="audioInput" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg">

      <div class="field">
        <label>BPM（テンポ）<span class="val" id="bpmVal">128</span></label>
        <input type="range" id="bpmSlider" min="70" max="190" value="128">
      </div>

      <div class="field">
        <label>難易度</label>
        <div class="diff-group" id="diffGroup">
          <button type="button" class="diff-btn" data-diff="easy">EASY</button>
          <button type="button" class="diff-btn active" data-diff="normal">NORMAL</button>
          <button type="button" class="diff-btn" data-diff="hard">HARD</button>
        </div>
      </div>

      <button class="primary" id="startBtn" disabled>スタート</button>
    </div>
  </section>

  <!-- PLAY -->
  <section id="play" class="screen hidden">
    <div class="hud">
      <div class="block">
        <div class="label">SCORE</div>
        <div class="value" id="scoreVal">0</div>
      </div>
      <div class="block" style="text-align:right">
        <div class="label">COMBO</div>
        <div class="value combo" id="comboVal">0</div>
      </div>
    </div>

    <div id="heatWrap"><div id="heatFill"></div></div>
    <div id="heatLabel">熱量</div>

    <div class="stage">
      <div id="climaxFlash"></div>
      <div id="climaxBanner">LIMIT BREAK!!</div>
      <div class="judge" id="judgeText"></div>
      <div id="laneField">
        <div class="lane" data-dir="up"><div class="notes" id="notesUp"></div><div class="burst"></div></div>
        <div class="lane" data-dir="down"><div class="notes" id="notesDown"></div><div class="burst"></div></div>
        <div class="lane" data-dir="left"><div class="notes" id="notesLeft"></div><div class="burst"></div></div>
        <div class="lane" data-dir="right"><div class="notes" id="notesRight"></div><div class="burst"></div></div>
        <div class="judgeLine"></div>
        <div class="laneKeys">
          <div class="laneKey up">⬆</div>
          <div class="laneKey down">⬇</div>
          <div class="laneKey left">⬅</div>
          <div class="laneKey right">➡</div>
        </div>
      </div>
    </div>

    <div id="mascotWrap">
      <div id="reactSlot">
        <img id="reactImg" src="" alt="">
        <div id="cutinWrap"><img id="cutinImg" src="" alt=""></div>
      </div>
      <div id="bodySlot">
        <img id="mascot" src="assets/mascot/idle_a.png" alt="">
      </div>
    </div>
    <div class="hint" id="playHint">降ってきたらレーンをタップ！</div>
    <div class="kbd-hint">キーボードでも操作できます　<kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&larr;</kbd><kbd>&rarr;</kbd></div>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen hidden">
    <div class="eyebrow">RESULT</div>
    <img id="resultMascot" src="" alt="">
    <div class="rank" id="rankLabel">S</div>
    <div class="card">
      <div class="stat-row"><span>スコア</span><span id="rScore">0</span></div>
      <div class="stat-row"><span>最大コンボ</span><span id="rCombo">0</span></div>
      <div class="stat-row"><span>PERFECT</span><span id="rPerfect">0</span></div>
      <div class="stat-row"><span>GOOD</span><span id="rGood">0</span></div>
      <div class="stat-row"><span>MISS</span><span id="rMiss">0</span></div>
      <button class="primary" id="retryBtn">もう一度あそぶ</button>
      <button class="ghost" id="changeBtn">曲を変える</button>
    </div>
  </section>

</div>
<script src="js/game.js"></script>
</body>
</html>
