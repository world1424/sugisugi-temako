<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>スギスギてまこ（推し熱量リズムゲーム）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
<div id="app">

  <!-- START -->
  <section id="start" class="screen">
    <div class="eyebrow">推し熱量リズムゲーム</div>
    <h1>スギスギてまこ</h1>
    <p class="sub">好きな曲を読み込んで、降ってくるノーツをタイミングよくタップ！<br>推し熱量ゲージを溜めて限界突破しよう。</p>
    <div class="card">
      <label class="upload-zone" id="uploadZone" for="audioInput">
        <svg class="upload-icon" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
        <div class="label" id="uploadLabel">音楽ファイルをタップして選ぶ</div>
        <div class="filetypes">mp3 / m4a / wav / aac / ogg</div>
        <div class="fname" id="fileName"></div>
      </label>
      <input type="file" id="audioInput" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg">

      <div class="field">
        <label>BPM（テンポ）<span class="val" id="bpmVal">128</span></label>
        <input type="range" id="bpmSlider" min="70" max="190" value="128">
      </div>

      <div class="field">
        <label>難易度</label>
        <div class="diff-group" id="diffGroup">
          <button type="button" class="diff-btn" data-diff="easy">EASY</button>
          <button type="button" class="diff-btn active" data-diff="normal">NORMAL</button>
          <button type="button" class="diff-btn" data-diff="hard">HARD</button>
        </div>
      </div>

      <button class="primary" id="startBtn" disabled>スタート</button>
      <button class="ghost" id="toVersusBtn">オンライン対戦・観戦</button>
    </div>
  </section>

  <!-- LOBBY -->
  <section id="lobby" class="screen hidden">
    <div class="eyebrow">ONLINE</div>
    <h1 class="lobbyHead">オンライン対戦</h1>

    <!-- 入口 -->
    <div class="card" id="lobbyEntry">
      <div class="field">
        <label>ニックネーム</label>
        <input type="text" id="nickInput" class="txt" maxlength="12" placeholder="てまこ推し">
      </div>
      <button class="primary" id="createRoomBtn">部屋を作る</button>

      <div class="field">
        <label>部屋コードで参加</label>
        <input type="text" id="joinCodeInput" class="txt code" maxlength="4" placeholder="ABCD"
               inputmode="latin" autocomplete="off" autocorrect="off" spellcheck="false">
      </div>
      <button class="primary" id="joinRoomBtn">プレイヤーで参加</button>
      <button class="ghost" id="spectateBtn">観戦で入る</button>
      <button class="ghost" id="lobbyBackBtn">もどる</button>
      <div class="netNote" id="lobbyMsg"></div>
    </div>

    <!-- 待機部屋 -->
    <div class="card hidden" id="lobbyRoom">
      <div class="roomCodeBox">
        <div class="roomCodeLabel">部屋コード</div>
        <div class="roomCodeVal" id="roomCodeVal">----</div>
        <div class="roomCodeHint">このコードを友達に伝えてください</div>
      </div>

      <div id="lobbySongArea">
        <label class="upload-zone" id="vsUploadZone" for="audioInput">
          <svg class="upload-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
          </svg>
          <div class="label" id="vsUploadLabel">自分の曲を選ぶ</div>
          <div class="filetypes">全員が同じ曲を用意してください</div>
          <div class="fname" id="vsFileName"></div>
        </label>
      </div>
      <div class="netNote" id="songWarn"></div>

      <div id="hostSettings" class="hidden">
        <div class="field">
          <label>BPM（テンポ）<span class="val" id="vsBpmVal">128</span></label>
          <input type="range" id="vsBpmSlider" min="70" max="190" value="128">
        </div>
        <div class="field">
          <label>難易度</label>
          <div class="diff-group" id="vsDiffGroup">
            <button type="button" class="diff-btn" data-diff="easy">EASY</button>
            <button type="button" class="diff-btn active" data-diff="normal">NORMAL</button>
            <button type="button" class="diff-btn" data-diff="hard">HARD</button>
          </div>
        </div>
      </div>
      <div id="guestSettings" class="netNote hidden"></div>

      <div class="playerList" id="playerList"></div>

      <button class="primary" id="readyBtn">準備完了</button>
      <button class="primary hidden" id="hostStartBtn">対戦スタート</button>
      <button class="ghost" id="leaveRoomBtn">退出する</button>
      <div class="netNote" id="roomMsg"></div>
    </div>
  </section>

  <!-- SPECTATE -->
  <section id="spectate" class="screen hidden">
    <div class="eyebrow">観戦中</div>
    <div class="specCode">部屋 <b id="specCodeVal">----</b></div>
    <div class="specBoard" id="specBoard"></div>
    <button class="ghost" id="specLeaveBtn">観戦をやめる</button>
  </section>

  <!-- COUNTDOWN -->
  <div id="countdown" class="hidden"><span id="countdownNum">3</span></div>

  <!-- PLAY -->
  <section id="play" class="screen hidden">
    <div class="hud">
      <div class="block">
        <div class="label">SCORE</div>
        <div class="value" id="scoreVal">0</div>
      </div>
      <div class="block" style="text-align:right">
        <div class="label">COMBO</div>
        <div class="value combo" id="comboVal">0</div>
      </div>
    </div>

    <div id="tapPrompt" class="hidden">
      <div class="tapBox">
        <div class="tapBig">画面をタップして開始</div>
        <div class="tapSub">音の再生がブロックされました</div>
      </div>
    </div>

    <div id="heatWrap"><div id="heatFill"></div></div>
    <div id="heatLabel">熱量</div>
    <div id="rivalPanel" class="hidden"></div>

    <div class="stage">
      <div id="climaxFlash"></div>
      <div id="climaxBanner">LIMIT BREAK!!</div>
      <div class="judge" id="judgeText"></div>
      <div id="laneField">
        <div class="lane" data-dir="up"><div class="notes" id="notesUp"></div><div class="burst"></div></div>
        <div class="lane" data-dir="down"><div class="notes" id="notesDown"></div><div class="burst"></div></div>
        <div class="lane" data-dir="left"><div class="notes" id="notesLeft"></div><div class="burst"></div></div>
        <div class="lane" data-dir="right"><div class="notes" id="notesRight"></div><div class="burst"></div></div>
        <div class="judgeLine"></div>
        <div class="laneKeys">
          <div class="laneKey up">⬆</div>
          <div class="laneKey down">⬇</div>
          <div class="laneKey left">⬅</div>
          <div class="laneKey right">➡</div>
        </div>
      </div>
    </div>

    <div id="mascotWrap">
      <div id="reactSlot">
        <img id="reactImg" src="" alt="">
        <div id="cutinWrap"><img id="cutinImg" src="" alt=""></div>
      </div>
      <div id="bodySlot">
        <img id="mascot" src="assets/mascot/idle_a.png" alt="">
      </div>
    </div>
    <div class="hint" id="playHint">降ってきたらレーンをタップ！</div>
    <div class="kbd-hint">キーボードでも操作できます　<kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&larr;</kbd><kbd>&rarr;</kbd></div>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen hidden">
    <div class="eyebrow">RESULT</div>
    <img id="resultMascot" src="" alt="">
    <div class="rank" id="rankLabel">S</div>
    <div class="card">
      <div class="stat-row"><span>スコア</span><span id="rScore">0</span></div>
      <div class="stat-row"><span>最大コンボ</span><span id="rCombo">0</span></div>
      <div class="stat-row"><span>PERFECT</span><span id="rPerfect">0</span></div>
      <div class="stat-row"><span>GOOD</span><span id="rGood">0</span></div>
      <div class="stat-row"><span>MISS</span><span id="rMiss">0</span></div>
      <button class="primary hidden" id="backToRoomBtn">部屋にもどる</button>
      <button class="primary" id="retryBtn">もう一度あそぶ</button>
      <button class="ghost" id="changeBtn">曲を変える</button>
    </div>
  </section>

</div>
<script src="js/game.js?v=5"></script>
<script type="module" src="js/versus.js?v=5"></script>
</body>
</html>
